<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Abstract performance benchmarking: many provider sources consolidated into a benchmark bar chart and a trend line">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#e6e9f3"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#545f80" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#545f80" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0b7a70" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".5" r=".5">
      <stop offset="0" stop-color="#0b7a70" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0b7a70" stop-opacity="0"/>
    </radialGradient>
    <marker id="ba" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0b7a70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- provider sources -->
  <g>
    <rect x="80" y="170" width="190" height="34" rx="9" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="80" y="222" width="190" height="34" rx="9" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="80" y="274" width="190" height="34" rx="9" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="80" y="326" width="190" height="34" rx="9" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="80" y="378" width="190" height="34" rx="9" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
  </g>
  <g fill="#545f80" fill-opacity=".55">
    <circle cx="104" cy="187" r="5"/><rect x="120" y="183" width="120" height="8" rx="4"/>
    <circle cx="104" cy="239" r="5"/><rect x="120" y="235" width="96" height="8" rx="4"/>
    <circle cx="104" cy="291" r="5"/><rect x="120" y="287" width="132" height="8" rx="4"/>
    <circle cx="104" cy="343" r="5"/><rect x="120" y="339" width="104" height="8" rx="4"/>
    <circle cx="104" cy="395" r="5"/><rect x="120" y="391" width="120" height="8" rx="4"/>
  </g>

  <!-- consolidation flow -->
  <path d="M270 291 C 330 291, 350 291, 420 291" fill="none" stroke="url(#flow)" stroke-width="8" stroke-linecap="round" marker-end="url(#ba)"/>

  <!-- benchmark bars panel -->
  <rect x="440" y="120" width="330" height="340" rx="20" fill="#ffffff" stroke="#0b7a70" stroke-opacity=".4" stroke-width="2"/>
  <line x1="474" y1="404" x2="736" y2="404" stroke="#545f80" stroke-opacity=".3"/>
  <g stroke="#0b7a70">
    <rect x="486" y="262" width="42" height="142" rx="5" fill="#0b7a70" fill-opacity=".3"/>
    <rect x="540" y="304" width="42" height="100" rx="5" fill="#0b7a70" fill-opacity=".2" stroke-opacity=".6"/>
    <rect x="594" y="212" width="42" height="192" rx="5" fill="#0b7a70" fill-opacity=".4"/>
    <rect x="648" y="330" width="42" height="74"  rx="5" fill="#0b7a70" fill-opacity=".18" stroke-opacity=".6"/>
    <rect x="702" y="286" width="42" height="118" rx="5" fill="#0b7a70" fill-opacity=".26" stroke-opacity=".6"/>
  </g>

  <!-- trend line panel -->
  <rect x="800" y="120" width="320" height="340" rx="20" fill="#ffffff" stroke="#0b7a70" stroke-opacity=".4" stroke-width="2"/>
  <line x1="832" y1="404" x2="1088" y2="404" stroke="#545f80" stroke-opacity=".3"/>
  <polyline points="840,368 878,344 916,352 954,300 992,312 1030,250 1068,222 1096,196"
            fill="none" stroke="#8f5b00" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#8f5b00">
    <circle cx="840" cy="368" r="5"/><circle cx="916" cy="352" r="5"/><circle cx="992" cy="312" r="5"/>
    <circle cx="1068" cy="222" r="5"/><circle cx="1096" cy="196" r="5"/>
  </g>

  <!-- ambient particles -->
  <g fill="#545f80" fill-opacity=".45">
    <circle cx="350" cy="120" r="3"/><circle cx="700" cy="500" r="3"/><circle cx="330" cy="470" r="2.5"/>
  </g>
</svg>
