<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Abstract documentation automation: product parameters flowing through a template engine into a validated client document">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#e6e9f3"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#545f80" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#545f80" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0b7a70" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".5" r=".5">
      <stop offset="0" stop-color="#0b7a70" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0b7a70" stop-opacity="0"/>
    </radialGradient>
    <marker id="da" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0b7a70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- parameter chips (inputs) -->
  <g>
    <rect x="90" y="150" width="230" height="40" rx="10" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="90" y="210" width="230" height="40" rx="10" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="90" y="270" width="230" height="40" rx="10" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="90" y="330" width="230" height="40" rx="10" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
    <rect x="90" y="390" width="230" height="40" rx="10" fill="#ffffff" stroke="#545f80" stroke-opacity=".38"/>
  </g>
  <g fill="#545f80" fill-opacity=".55">
    <circle cx="116" cy="170" r="5"/><rect x="132" y="166" width="120" height="8" rx="4"/>
    <circle cx="116" cy="230" r="5"/><rect x="132" y="226" width="150" height="8" rx="4"/>
    <circle cx="116" cy="290" r="5"/><rect x="132" y="286" width="96" height="8" rx="4"/>
    <circle cx="116" cy="350" r="5"/><rect x="132" y="346" width="132" height="8" rx="4"/>
    <circle cx="116" cy="410" r="5"/><rect x="132" y="406" width="110" height="8" rx="4"/>
  </g>

  <!-- flow into the engine -->
  <path d="M320 290 C 380 290, 400 290, 470 290" fill="none" stroke="url(#flow)" stroke-width="8" stroke-linecap="round" marker-end="url(#da)"/>

  <!-- template engine (gold) -->
  <rect x="480" y="220" width="200" height="150" rx="18" fill="#8f5b00" fill-opacity=".08" stroke="#8f5b00" stroke-opacity=".5" stroke-width="2"/>
  <g fill="#8f5b00" fill-opacity=".85">
    <rect x="512" y="252" width="136" height="10" rx="5"/>
    <rect x="512" y="286" width="100" height="8" rx="4" fill-opacity=".6"/>
    <rect x="512" y="308" width="120" height="8" rx="4" fill-opacity=".6"/>
    <rect x="512" y="330" width="80" height="8" rx="4" fill-opacity=".6"/>
  </g>

  <!-- controlled flow out -->
  <path d="M680 290 C 740 290, 760 290, 830 290" fill="none" stroke="#0b7a70" stroke-opacity=".9" stroke-width="8" stroke-linecap="round" marker-end="url(#da)"/>

  <!-- validated document (output) -->
  <rect x="850" y="150" width="260" height="320" rx="20" fill="#ffffff" stroke="#0b7a70" stroke-opacity=".45" stroke-width="2"/>
  <g fill="#464e63" fill-opacity=".7">
    <rect x="884" y="188" width="150" height="12" rx="6"/>
    <rect x="884" y="224" width="192" height="8" rx="4" fill-opacity=".5"/>
    <rect x="884" y="246" width="168" height="8" rx="4" fill-opacity=".5"/>
    <rect x="884" y="268" width="192" height="8" rx="4" fill-opacity=".5"/>
    <rect x="884" y="300" width="120" height="8" rx="4" fill-opacity=".5"/>
    <rect x="884" y="322" width="150" height="8" rx="4" fill-opacity=".5"/>
  </g>
  <!-- validation tick -->
  <circle cx="980" cy="410" r="30" fill="#0b7a70" fill-opacity=".12" stroke="#0b7a70" stroke-width="2"/>
  <path d="M966 411 L976 421 L996 398" fill="none" stroke="#0b7a70" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ambient particles -->
  <g fill="#545f80" fill-opacity=".45">
    <circle cx="400" cy="120" r="3"/><circle cx="740" cy="470" r="3"/><circle cx="360" cy="500" r="2.5"/>
  </g>
</svg>
